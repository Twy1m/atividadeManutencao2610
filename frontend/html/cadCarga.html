<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/cadCarga.js" defer></script>
    <title>Cadastrar Carga</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>
        </nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Cadastrar Carga</h1>
        <form>
            <label for="descricao">Descrição</label><br>
            <input type="text" id="descricao" required><br><br>

            <label for="peso">Peso (kg)</label><br>
            <input type="text" id="peso" required><br><br>

            <label for="volume">Volume (m³)</label><br>
            <input type="number" id="volume" step="0.01" required><br><br>

            <label for="codRastreio">Código de Rastreio</label><br>
            <input type="text" id="codRastreio" required><br><br>

            <label for="idMotorista">ID do Motorista</label><br>
            <input type="number" id="idMotorista" required><br><br>

            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
