<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/cadEntrega.js" defer></script>
    <title>Cadastrar Entrega</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>
        </nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Cadastrar Entrega</h1>
        <form>
            <label for="cidadeDestino">Cidade de Destino</label><br>
            <input type="text" id="cidadeDestino" required><br><br>

            <label for="statusAtual">Status Atual</label><br>
            <select id="statusAtual" required>
                <option value="">-- Selecione --</option>
                <option value="TRANSITO">TRÂNSITO</option>
                <option value="ENTREGUE">ENTREGUE</option>
            </select><br><br>

            <label for="dataHora">Data e Hora</label><br>
            <input type="datetime-local" id="dataHora" required><br><br>

            <label for="idCarga">ID da Carga</label><br>
            <input type="number" id="idCarga" required><br><br>

            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
